[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augur-estimator"
version = "0.1.0"
description = "Estimate Pauli observables on quantum circuits with classical simulators, with a trust label on every number"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Ramirez", email = "pablo@matrixcr.ai" }]
dependencies = [
    "numpy==2.5.3",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "pauli-prop==0.2.1",
]

[project.optional-dependencies]
cloud = ["bluequbit==0.19.0b1", "python-dotenv==1.2.3"]
test = ["pytest==9.1.1", "bluequbit==0.19.0b1"]

[project.scripts]
augur = "augur.core:_cli"

[tool.setuptools]
packages = ["augur"]
